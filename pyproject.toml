[project]
name = "ragscate"
version = "0.1.0"
description = "Asistente RAG local para comprender codigo PowerBuilder con citas verificables"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio>=4.4,<4.10",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.28",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "sentence-transformers>=5,<7",
  "uvicorn[standard]>=0.30,<0.35",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
ragscate = "rag_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_app"]

[tool.pytest.ini_options]
testpaths = ["tests/rag"]
addopts = "-q"

[tool.coverage.run]
source = ["rag_app"]
